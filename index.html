

<!DOCTYPE html>

<html lang="sv">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pluggnästet – Min avatar</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#111126;color:#f4efff;font-family:Arial,sans-serif;padding:22px}

header{text-align:center;margin-bottom:25px}

h1{color:#d9bdff;margin-bottom:5px}

.subtitle{color:#aaa1c7}

main{max-width:850px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}

.panel{background:#201e3d;border:1px solid #454064;border-radius:22px;padding:20px}

.avatar-area{background:radial-gradient(circle,#51427d,#211d42 70%);border-radius:18px;min-height:330px;display:flex;align-items:center;justify-content:center;flex-direction:column}

.avatar{position:relative;width:190px;height:255px}

.hair{position:absolute;top:10px;left:37px;width:116px;height:100px;background:#593c32;border-radius:55% 55% 35% 35%;z-index:2}

.face{position:absolute;top:38px;left:43px;width:104px;height:112px;background:#f2c5a5;border-radius:48% 48% 46% 46%;z-index:3}

.fringe{position:absolute;top:34px;left:44px;width:105px;height:48px;background:#593c32;border-radius:50% 50% 35% 20%;z-index:4}

.eye{position:absolute;top:91px;width:9px;height:13px;background:#30233a;border-radius:50%;z-index:5}

.eye.left{left:70px}.eye.right{left:113px}

.smile{position:absolute;top:119px;left:87px;width:18px;height:9px;border-bottom:3px solid #a45d69;border-radius:50%;z-index:5}

.body{position:absolute;top:143px;left:23px;width:145px;height:105px;background:#a78bfa;border-radius:55px 55px 22px 22px;z-index:2}

.neck{position:absolute;top:132px;left:83px;width:30px;height:28px;background:#f2c5a5;z-index:1}

.accessory{position:absolute;top:18px;left:135px;font-size:28px;z-index:6}

.controls{display:grid;gap:14px}

label{display:block;color:#cbbbe9;font-size:14px;margin-bottom:7px}

select{width:100%;padding:12px;background:#302b50;color:white;border:1px solid #655a88;border-radius:10px;font-size:15px}

button{padding:13px;border:0;border-radius:12px;background:#a78bfa;color:#17132a;font-weight:bold;font-size:15px;cursor:pointer}

button:hover{background:#c5aaff}

.stats{color:#cbbbe9;font-size:14px;margin-top:15px}

@media(max-width:650px){main{grid-template-columns:1fr}body{padding:14px}}

</style>

</head>

<body>

<header>

<h1>🐝 Pluggnästet</h1>

<div class="subtitle">Ditt rum. Din stil. Din studieresa.</div>

</header>

<main>

<section class="panel">

<h2>Min avatar</h2>

<div class="avatar-area">

<div class="avatar">

<div class="hair" id="backHair"></div>

<div class="neck"></div>

<div class="body" id="outfit"></div>

<div class="face"></div>

<div class="fringe" id="frontHair"></div>

<div class="eye left"></div><div class="eye right"></div>

<div class="smile"></div>

<div class="accessory" id="accessory"></div>

</div>

<div>✨ Din Pluggnästet-avatar</div>

</div>

<div class="stats">⭐ 1 250 XP · Nivå 4</div>

</section>

<section class="panel">

<h2>Anpassa din stil</h2>

<div class="controls">

<div>

<label for="hair">Frisyr</label>

<select id="hair">

<option value="round">Mjuk och rund</option>

<option value="short">Kort frisyr</option>

<option value="long">Lång frisyr</option>

</select>

</div>

<div>

<label for="hairColor">Hårfärg</label>

<select id="hairColor">

<option value="#593c32">Chokladbrun</option>

<option value="#171522">Midnattsvart</option>

<option value="#d9a64e">Honungsblond</option>

<option value="#a76bd6">Lavendel</option>

<option value="#b85b76">Rosaröd</option>

</select>

</div>

<div>

<label for="clothes">Kläder</label>

<select id="clothes">

<option value="#a78bfa">Lila hoodie</option>

<option value="#77a9c9">Blå tröja</option>

<option value="#8eae91">Grön tröja</option>

<option value="#d58ca9">Rosa tröja</option>

</select>

</div>

<div>

<label for="extra">Accessoar</label>

<select id="extra">

<option value="">Ingen</option>

<option value="🎧">Hörlurar</option>

<option value="⭐">Stjärna</option>

<option value="🎀">Rosett</option>

<option value="👑">Krona</option>

</select>

</div>

<button id="save">Spara min avatar</button>

<div id="message" class="stats">Välj din stil och spara!</div>

</div>

</section>

</main>

<script>

const ids=["hair","hairColor","clothes","extra"];

function update(){

const hair=document.getElementById("hair").value;

const color=document.getElementById("hairColor").value;

document.getElementById("backHair").style.background=color;

document.getElementById("frontHair").style.background=color;

document.getElementById("outfit").style.background=document.getElementById("clothes").value;

const back=document.getElementById("backHair");

const front=document.getElementById("frontHair");

back.style.height=hair==="long"?"165px":hair==="short"?"65px":"100px";

back.style.width=hair==="short"?"105px":"116px";

front.style.height=hair==="short"?"30px":"48px";

document.getElementById("accessory").textContent=document.getElementById("extra").value;

}

ids.forEach(id=>document.getElementById(id).addEventListener("change",update));

document.getElementById("save").addEventListener("click",()=>{

const data={};

ids.forEach(id=>data[id]=document.getElementById(id).value);

localStorage.setItem("pluggnastetAvatar",JSON.stringify(data));

document.getElementById("message").textContent="✨ Din avatar är sparad!";

});

const saved=JSON.parse(localStorage.getItem("pluggnastetAvatar")||"null");

if(saved)ids.forEach(id=>{if(saved[id])document.getElementById(id).value=saved[id]});

update();

</script>

</body>

</html>
