

<!DOCTYPE html>

<html lang="sv">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pluggnästet – Avatar Studio</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#111126;color:#f5efff;font-family:Arial,sans-serif}

header{text-align:center;padding:28px 15px}

h1{color:#d6baff;font-size:34px;margin:0 0 8px}

.sub{color:#b8acd5}

main{max-width:950px;margin:auto;padding:12px;display:grid;grid-template-columns:1.1fr 1fr;gap:18px}

.panel{background:#211f40;border:1px solid #514775;border-radius:22px;padding:20px}

h2{margin:0 0 16px}

#stage{height:390px;border-radius:18px;overflow:hidden;background:radial-gradient(circle,#55427e,#211b40 75%);position:relative;touch-action:pan-y}

#stage canvas{display:block;width:100%;height:100%}

.hint{text-align:center;color:#c9b9e8;font-size:13px;margin-top:10px}

.controls{display:grid;gap:13px}

label{display:block;font-size:14px;color:#c9b9e8;margin-bottom:6px}

select{width:100%;padding:12px;background:#302b50;color:white;border:1px solid #66598c;border-radius:10px;font-size:15px}

button{padding:13px;border:0;border-radius:12px;background:#ae91fa;color:#1a1530;font-size:15px;font-weight:bold;cursor:pointer}

button:active{transform:scale(.98)}

.stats{color:#e3d4ff;margin-top:16px;font-size:14px}

.note{color:#b9afd0;font-size:13px;line-height:1.5}

@media(max-width:680px){main{grid-template-columns:1fr}#stage{height:350px}h1{font-size:29px}}

</style>

</head>

<body>

<header>

<h1>🐝 Pluggnästet</h1>

<div class="sub">Avatar Studio · Skapa din egen karaktär</div>

</header>

<main>

<section class="panel">

<h2>✨ Min 3D-avatar</h2>

<div id="stage"></div>

<div class="hint">Dra med fingret för att vrida avataren ↔</div>

<div class="stats">⭐ 1 250 XP · Nivå 4</div>

</section>

<section class="panel">

<h2>🎨 Anpassa din avatar</h2>

<div class="controls">

<div><label for="hair">Frisyr</label>

<select id="hair">

<option value="round">Mjuk och rund</option>

<option value="short">Kort frisyr</option>

<option value="long">Lång frisyr</option>

<option value="spiky">Busig frisyr</option>

</select></div>

<div><label for="hairColor">Hårfärg</label>

<select id="hairColor">

<option value="#593c32">Chokladbrun</option>

<option value="#211b2c">Midnattsvart</option>

<option value="#e0b45e">Honungsblond</option>

<option value="#a76bd6">Lavendel</option>

<option value="#bd6689">Rosaröd</option>

<option value="#648b9f">Blå</option>

</select></div>

<div><label for="skin">Hudton</label>

<select id="skin">

<option value="#f2c5a5">Ljus varm</option>

<option value="#d99b75">Mellan</option>

<option value="#a96f50">Djup varm</option>

<option value="#704832">Djup</option>

</select></div>

<div><label for="clothes">Kläder</label>

<select id="clothes">

<option value="#a78bfa">Lila hoodie</option>

<option value="#77a9c9">Blå tröja</option>

<option value="#8eae91">Grön tröja</option>

<option value="#d58ca9">Rosa tröja</option>

<option value="#e0ad68">Gyllene tröja</option>

</select></div>

<div><label for="extra">Accessoar</label>

<select id="extra">

<option value="none">Ingen</option>

<option value="headphones">Hörlurar</option>

<option value="crown">Krona</option>

<option value="glasses">Glasögon</option>

<option value="star">Stjärna</option>

</select></div>

<button id="save">Spara min avatar</button>

<div id="message" class="stats">Välj din stil!</div>

<p class="note">Dina val sparas på den här enheten. Fler frisyrer och belöningar kommer i nästa uppdatering.</p>

</div>

</section>

</main>

<script type="importmap">

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}

</script>

<script type="module">

import * as THREE from "three";

const stage=document.getElementById("stage");

const scene=new THREE.Scene();

scene.background=new THREE.Color("#342951");

const camera=new THREE.PerspectiveCamera(35,1,.1,100);

camera.position.set(0,1.1,7);

const renderer=new THREE.WebGLRenderer({antialias:true});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.outputColorSpace=THREE.SRGBColorSpace;

stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x78618f,2));

const light=new THREE.DirectionalLight(0xffffff,2.5);

light.position.set(-3,5,6);scene.add(light);

const fill=new THREE.PointLight(0xbda2ff,15,15);

fill.position.set(3,2,3);scene.add(fill);

const avatar=new THREE.Group();scene.add(avatar);

const parts=new THREE.Group();avatar.add(parts);

const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});

function sphere(parent,x,y,z,sx,sy,sz,color){

const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),mat(color));

m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m;

}

function box(parent,x,y,z,sx,sy,sz,color){

const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));

m.position.set(x,y,z);parent.add(m);return m;

}

function torus(parent,x,y,z,r,t,color){

const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,12,48),mat(color));

m.position.set(x,y,z);parent.add(m);return m;

}


function build(){
while(parts.children.length)parts.remove(parts.children[0]);

const skin=document.getElementById("skin").value;
const hair=document.getElementById("hairColor").value;
const clothes=document.getElementById("clothes").value;
const style=document.getElementById("hair").value;
const extra=document.getElementById("extra").value;
const pants="#35334f";
const shoes="#e5d9ff";

// Hjälpfunktion för armar och ben
function limb(x,y,z,length,radius,color,rotation=0){
const m=new THREE.Mesh(
new THREE.CapsuleGeometry(radius,length,8,16),
mat(color)
);
m.position.set(x,y,z);
m.rotation.z=rotation;
parts.add(m);
return m;
}

// Kropp och hals
const torso=new THREE.Mesh(
new THREE.CapsuleGeometry(.55,.75,8,24),
mat(clothes)
);
torso.position.y=-.65;
torso.scale.set(1,.9,.8);
parts.add(torso);

sphere(parts,0,.15,0,.23,.3,.23,skin);

// Ben
limb(-.29,-1.65,0,.65,.20,pants);
limb(.29,-1.65,0,.65,.20,pants);

// Skor
sphere(parts,-.30,-2.15,.13,.29,.17,.43,shoes);
sphere(parts,.30,-2.15,.13,.29,.17,.43,shoes);

// Armar
limb(-.78,-.65,0,.65,.19,clothes,-.28);
limb(.78,-.65,0,.65,.19,clothes,.28);

// Händer
sphere(parts,-1.00,-1.08,.04,.17,.17,.17,skin);
sphere(parts,1.00,-1.08,.04,.17,.17,.17,skin);

// Huvud
sphere(parts,0,1.15,0,.78,.95,.68,skin);

// Hår
sphere(parts,0,1.72,-.02,.81,.58,.7,hair);
sphere(parts,0,1.48,.51,.72,.25,.25,hair);

if(style==="long"){
sphere(parts,-.68,.95,-.05,.18,.85,.3,hair);
sphere(parts,.68,.95,-.05,.18,.85,.3,hair);
}
if(style==="short"){
sphere(parts,-.62,1.25,-.05,.18,.35,.3,hair);
sphere(parts,.62,1.25,-.05,.18,.35,.3,hair);
}
if(style==="spiky"){
for(let i=-2;i<=2;i++){
const spike=new THREE.Mesh(
new THREE.ConeGeometry(.16,.48,16),
mat(hair)
);
spike.position.set(i*.24,2.12,0);
spike.rotation.z=i*.16;
parts.add(spike);
}
}

// Ansikte
sphere(parts,-.29,1.22,.61,.085,.13,.06,"#30233e");
sphere(parts,.29,1.22,.61,.085,.13,.06,"#30233e");
sphere(parts,0,1.03,.67,.055,.07,.045,"#d99f82");

const smile=torus(parts,0,.91,.64,.13,.018,"#a65f6c");
smile.scale.y=.38;

// Accessoarer
if(extra==="headphones"){
torus(parts,0,1.75,0,.83,.09,"#6bd0df");
sphere(parts,-.79,1.35,0,.16,.25,.16,"#6bd0df");
sphere(parts,.79,1.35,0,.16,.25,.16,"#6bd0df");
}
if(extra==="crown"){
for(let i=0;i<5;i++){
const spike=new THREE.Mesh(
new THREE.ConeGeometry(.12,.32,4),
mat("#f6ce65")
);
spike.position.set((i-2)*.22,2.28,0);
parts.add(spike);
}
box(parts,0,2.12,0,.95,.12,.22,"#f6ce65");
}
if(extra==="glasses"){
torus(parts,-.29,1.22,.69,.19,.035,"#e6d7ff");
torus(parts,.29,1.22,.69,.19,.035,"#e6d7ff");
box(parts,0,1.22,.69,.17,.045,.04,"#e6d7ff");
}
if(extra==="star"){
const star=new THREE.Mesh(
new THREE.OctahedronGeometry(.22),
mat("#ffe17b")
);
star.position.set(.9,2.1,.1);
parts.add(star);
}
}


build();

let targetRotation=0,dragging=false,lastX=0;

stage.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;stage.setPointerCapture(e.pointerId)});

stage.addEventListener("pointermove",e=>{

if(!dragging)return;

targetRotation+=(e.clientX-lastX)*.012;lastX=e.clientX;

});

stage.addEventListener("pointerup",()=>dragging=false);

stage.addEventListener("pointercancel",()=>dragging=false);

function resize(){

const w=stage.clientWidth,h=stage.clientHeight;

renderer.setSize(w,h,false);

camera.aspect=w/h;camera.updateProjectionMatrix();

}

new ResizeObserver(resize).observe(stage);resize();

function animate(){

requestAnimationFrame(animate);

avatar.rotation.y+=(targetRotation-avatar.rotation.y)*.12;

renderer.render(scene,camera);

}

animate();

["hair","hairColor","skin","clothes","extra"].forEach(id=>{

document.getElementById(id).addEventListener("change",build);

});

const ids=["hair","hairColor","skin","clothes","extra"];

const saved=JSON.parse(localStorage.getItem("pluggnastetAvatar3D")||"null");

if(saved){

ids.forEach(id=>{if(saved[id])document.getElementById(id).value=saved[id]});

build();

}

document.getElementById("save").addEventListener("click",()=>{

const data={};

ids.forEach(id=>data[id]=document.getElementById(id).value);

localStorage.setItem("pluggnastetAvatar3D",JSON.stringify(data));

document.getElementById("message").textContent="✨ Din 3D-avatar är sparad!";

});

</script>

</body>

</html>
